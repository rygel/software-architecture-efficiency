<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">How the architecture-efficiency skill works</title>
  <desc id="d">A request is routed to a desktop, server or hybrid track. Each track loads its references. The result is a report that labels every figure as measured, published, estimated or unknown.</desc>
  <style>
    .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5}
    .key{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .out{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .no{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
    text{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
    .h{font-weight:700;font-size:15px}
    .s{font-size:12.5px;fill:#424a53}
    .a{stroke:#57606a;stroke-width:1.8;fill:none;marker-end:url(#ar)}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>

  <rect class="box" x="20" y="180" width="170" height="90" rx="8"/>
  <text class="h" x="105" y="212" text-anchor="middle">Your request</text>
  <text class="s" x="105" y="234" text-anchor="middle">"Is Tauri the efficient</text>
  <text class="s" x="105" y="251" text-anchor="middle">choice?" or a project</text>

  <path class="a" d="M190 225 H236"/>

  <rect class="key" x="240" y="170" width="150" height="110" rx="8"/>
  <text class="h" x="315" y="200" text-anchor="middle">Pick the track</text>
  <text class="s" x="315" y="222" text-anchor="middle">from the actual</text>
  <text class="s" x="315" y="239" text-anchor="middle">deployment, not the</text>
  <text class="s" x="315" y="256" text-anchor="middle">framework name</text>

  <path class="a" d="M390 200 C420 200 420 80 450 80"/>
  <path class="a" d="M390 225 H450"/>
  <path class="a" d="M390 250 C420 250 420 370 450 370"/>

  <rect class="box" x="454" y="30" width="220" height="100" rx="8"/>
  <text class="h" x="564" y="56" text-anchor="middle">Desktop</text>
  <text class="s" x="564" y="78" text-anchor="middle">Lowest RAM, no WebView</text>
  <text class="s" x="564" y="95" text-anchor="middle">full process tree, idle + peak</text>
  <text class="s" x="564" y="112" text-anchor="middle">references/desktop.md</text>

  <rect class="box" x="454" y="175" width="220" height="100" rx="8"/>
  <text class="h" x="564" y="201" text-anchor="middle">Server</text>
  <text class="s" x="564" y="223" text-anchor="middle">Concurrency, recovery, hosting</text>
  <text class="s" x="564" y="240" text-anchor="middle">SQLite first, Caddy, native</text>
  <text class="s" x="564" y="257" text-anchor="middle">references/server.md</text>

  <rect class="box" x="454" y="320" width="220" height="100" rx="8"/>
  <text class="h" x="564" y="346" text-anchor="middle">Hybrid</text>
  <text class="s" x="564" y="368" text-anchor="middle">Desktop rules for the client,</text>
  <text class="s" x="564" y="385" text-anchor="middle">server rules for the backend</text>
  <text class="s" x="564" y="402" text-anchor="middle">resources counted separately</text>

  <path class="a" d="M674 80 C705 80 705 225 736 225"/>
  <path class="a" d="M674 225 H736"/>
  <path class="a" d="M674 370 C705 370 705 225 736 225"/>

  <rect class="out" x="740" y="120" width="145" height="210" rx="8"/>
  <text class="h" x="812" y="148" text-anchor="middle">Report</text>
  <text class="s" x="812" y="172" text-anchor="middle">Current vs. alternatives</text>
  <text class="s" x="812" y="192" text-anchor="middle">Every figure is labelled:</text>
  <text class="s" x="812" y="214" text-anchor="middle">measured</text>
  <text class="s" x="812" y="231" text-anchor="middle">published</text>
  <text class="s" x="812" y="248" text-anchor="middle">estimated</text>
  <text class="s" x="812" y="265" text-anchor="middle">unknown until X</text>
  <text class="s" x="812" y="293" text-anchor="middle">Staged plan with</text>
  <text class="s" x="812" y="310" text-anchor="middle">rollback points</text>

  <rect class="no" x="20" y="320" width="370" height="100" rx="8"/>
  <text class="h" x="205" y="348" text-anchor="middle">Not used for</text>
  <text class="s" x="205" y="372" text-anchor="middle">ordinary feature work, debugging, writing a Dockerfile</text>
  <text class="s" x="205" y="392" text-anchor="middle">or carrying out a migration. A review does not</text>
  <text class="s" x="205" y="410" text-anchor="middle">authorize a rewrite or a purchase.</text>
</svg>
